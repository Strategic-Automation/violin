engagement:
  client: "escape.tech (benchmark)"
  tester: "Violin Benchmark"
  date: "2026-07-19"
  duration: "1 session"

targets:
  ip_addresses: ["duck-store.escape.tech"]
  domains: ["duck-store.escape.tech"]
  urls: ["https://duck-store.escape.tech"]
  in_scope_urls: ["https://duck-store.escape.tech"]

assessment_hosts:
  callback_hosts: []

authorized_parties: ["benchmark operator"]

rules_of_engagement:
  allowed_actions:
    - "host/port discovery"
    - "banner grabbing"
    - "version detection"
    - "vulnerability scanning"
    - "vulnerability research"
    - "cve research"
    - "exploitdb"
    - "exploit validation (in-scope, non-destructive)"
    - "API enumeration"
    - "account registration"
    - "reporting"
    - "retrospective"
  forbidden_actions:
    - "web_search for duck-store vulnerabilities/walkthroughs/writeups"
    - "browsing duck-store source code"
    - "credential-stuffing"
    - "fetching /openapi.json or /vulnerabilities or endpoints that list challenges or intentional vulnerabilities"
    - "reading local benchmark answer keys (challenges.json)"

exclusions:
  urls:
    - "https://duck-store.escape.tech/openapi.json"
    - "https://duck-store.escape.tech/vulnerabilities"
  paths:
    - "/openapi.json"
    - "/vulnerabilities"

authorisation:
  confirmed: true
  confirmed_by: "benchmark operator"

research_hosts:
  - nvd.nist.gov
  - services.nvd.nist.gov
  - api.osv.dev
  - www.exploit-db.com
  - raw.githubusercontent.com

benchmark:
  mode: true
  openapi_spec: "https://duck-store.escape.tech/openapi.json"
  register_account: true
  anti_walkthrough: true

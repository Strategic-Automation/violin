name: violin_guard
version: 4.0.0
description: Typed scope guards and an execute-and-record boundary with bounded synchronization
  windows.
kind: standalone
pip_dependencies:
  - bashlex>=0.18,<1
  - cryptography>=45,<51
  - filelock>=4.0.1,<5
  - pydantic>=2.0,<3
  - psutil>=6.0.0,<9
  - netaddr>=1.3.0,<2
  - yarl>=1.9,<2
  - pyyaml>=6.0,<7
  - markdown-it-py>=3.0,<5
provides_tools:
- violin_record_ptt
- violin_record_hypothesis
- violin_submit_finding
- violin_exec
- violin_exec_status
- violin_exec_cancel
- violin_review_batch
- violin_rebind_pending_batch
- violin_heartbeat_done
- violin_exec_burst
- violin_target
- violin_status
hooks:
- pre_tool_call
- post_tool_call
- pre_llm_call
- on_session_reset
- on_session_finalize
toolsets:
  violin_guard:
    description: Violin engagement guard tools
app_style: sh

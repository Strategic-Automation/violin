name: violin-guard
version: 3.2.1
description: Typed scope guards and an execute-and-record boundary with bounded synchronization
  windows.
kind: standalone
provides_tools:
- violin_record_ptt
- violin_record_hypothesis
- violin_exec
- violin_exec_status
- violin_exec_cancel
- violin_review_batch
- violin_rebind_pending_batch
- violin_heartbeat_done
- violin_exec_burst
- violin_target
- violin_status
hooks:
- pre_tool_call
- post_tool_call
- pre_llm_call
- on_session_reset
- on_session_finalize
toolsets:
  violin_guard:
    description: Violin engagement guard tools
app_style: sh

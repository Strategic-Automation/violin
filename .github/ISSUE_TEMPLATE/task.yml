name: Engineering Task
description: Refactor, research, maintenance, documentation, or other bounded engineering work
type: task
body:
  - type: markdown
    attributes:
      value: |
        Use this form for bounded engineering work that is not a product defect or feature request.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Duplicate check
      options:
        - label: I searched open and closed issues and open pull requests for overlapping work.
          required: true

  - type: dropdown
    id: work-type
    attributes:
      label: Work type
      options:
        - Refactor
        - Research / evaluation
        - Maintenance
        - Documentation
        - Testing / quality
        - CI / packaging
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: State the bounded outcome this task should deliver.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why this matters
      description: Explain the concrete benefit or risk being addressed.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Proposed implementation
      description: Define in-scope work, important constraints, and explicit non-goals where useful.
    validations:
      required: true

  - type: textarea
    id: implementation-area
    attributes:
      label: Implementation area
      description: Likely components/files and tests affected.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use observable, testable outcomes.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: Dependencies / related work
      description: Link related issues/PRs. Use native dependencies/sub-issues when available.

  - type: textarea
    id: verification
    attributes:
      label: Verification / references
      description: Planned checks, benchmarks, upstream docs, or research sources.

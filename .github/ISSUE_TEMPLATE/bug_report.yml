name: Bug Report
description: Report a reproducible defect in Violin
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not post target data, credentials, customer evidence,
        or undisclosed security vulnerabilities. See SECURITY.md for private reporting.

  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Duplicate check
      options:
        - label: I searched open and closed issues for the same defect.
          required: true

  - type: input
    id: version
    attributes:
      label: Violin version or commit
      description: Version from distribution.yaml or the exact commit SHA.
      placeholder: "v3.x.x or 0123456"
    validations:
      required: true

  - type: input
    id: hermes-version
    attributes:
      label: Hermes version
      description: Run `hermes --version`.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Kali Linux (native)
        - Parrot OS (native)
        - Kali Docker container
        - WSL2
        - macOS
        - Windows (Git Bash)
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Concisely describe the defect and its user-visible or workflow impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic reproduction.
      placeholder: |
        1. ...
        2. ...
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: implementation-area
    attributes:
      label: Implementation area
      description: Likely components/files involved, if known.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes that would prove the bug is fixed.
      placeholder: |
        - [ ] ...
        - [ ] Regression test covers ...
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: Dependencies / related work
      description: Link related issues/PRs. Use native dependencies when available.

  - type: textarea
    id: guard-output
    attributes:
      label: Guard output
      description: Sanitized output from check-release/check-command if relevant.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Sanitized logs only.
      render: shell

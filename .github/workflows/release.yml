name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract Version & Changelog Notes
        id: release_info
        run: |
          python - <<'EOF'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          if not pyproject.exists():
              print("pyproject.toml not found; skipping release.")
              exit(0)

          version = tomllib.loads(pyproject.read_text(encoding="utf-8"))["project"]["version"]
          tag = f"v{version}"
          print(f"Current version in pyproject.toml: {version} (tag: {tag})")

          # Check if tag already exists in the repo
          existing_tags = subprocess.run(
              ["git", "tag", "-l", tag],
              capture_output=True,
              text=True,
              check=True
          ).stdout.strip()

          if existing_tags:
              print(f"Tag {tag} already exists; nothing to release.")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("tag_exists=true\n")
              exit(0)

          # Extract notes from CHANGELOG.md for this version
          changelog_path = Path("CHANGELOG.md")
          notes = ""
          if changelog_path.exists():
              content = changelog_path.read_text(encoding="utf-8")
              pattern = rf"##\s+{re.escape(version)}(?:\s+\([^)]+\))?\s*\n(.*?)(?=\n##\s+|\Z)"
              match = re.search(pattern, content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()

          if not notes:
              notes = f"Release {tag}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"tag={tag}\n")
              fh.write("tag_exists=false\n")

          with open("RELEASE_NOTES.md", "w", encoding="utf-8") as fh:
              fh.write(notes)
          EOF

      - name: Create GitHub Release and Tag
        if: steps.release_info.outputs.tag_exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Violin ${{ steps.release_info.outputs.tag }}
          body_path: RELEASE_NOTES.md
          target_commitish: master

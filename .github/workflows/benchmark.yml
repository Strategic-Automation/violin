name: Hermes Profile Benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'OpenRouter model ID selected by the operator'
        required: true
      target_url:
        description: 'Target Host / URL'
        required: true
        default: 'http://localhost:8080'
      target_isolation_id:
        description: 'Immutable target image digest or reset identifier'
        required: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Tier 1: Scorer Calibration (fast, deterministic, no Hermes/LLM needed)
#   Runs on every push/PR via the main ci.yml workflow. This manual workflow
#   repeats benchmark tests and both scorer calibration fixtures in Docker.
#
# Tier 2: Live LLM Benchmark (manual trigger, needs Hermes + OpenRouter key)
#   This workflow — triggered via workflow_dispatch only.
# ---------------------------------------------------------------------------

jobs:
  benchmark:
    name: Live Hermes Profile Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # ── Tier 1 gate: scorer calibration must pass before live run ──
      - name: Build Test Image
        run: docker build --file Dockerfile.test --tag violin-tests:${GITHUB_SHA} .

      - name: Scorer Calibration Gate
        run: |
          docker run --rm --network none \
            --name "violin-calibration-${GITHUB_RUN_ID}" \
            "violin-tests:${GITHUB_SHA}"

      # ── Tier 2: live LLM benchmark in the pinned Violin runtime image ──
      - name: Build Violin Runtime Image
        run: docker build --tag violin-benchmark:${GITHUB_SHA} .

      - name: Run Live Benchmark in Docker
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_ID: ${{ inputs.model }}
          TARGET_URL: ${{ inputs.target_url }}
          TARGET_ISOLATION_ID: ${{ inputs.target_isolation_id }}
        run: |
          mkdir -p engagements
          docker run --rm \
            --name "violin-benchmark-${GITHUB_RUN_ID}" \
            --env OPENROUTER_API_KEY \
            --mount "type=bind,source=$PWD/engagements,target=/violin/engagements" \
            "violin-benchmark:${GITHUB_SHA}" \
            uv run --no-dev python -m benchmark.run \
            --eng-dir "/violin/engagements/benchmark-run-${GITHUB_RUN_ID}" \
            --model "$MODEL_ID" \
            --provider openrouter \
            --api-base https://openrouter.ai/api/v1 \
            --target "$TARGET_URL" \
            --target-isolation-id "$TARGET_ISOLATION_ID" \
            --json-out "/violin/engagements/benchmark_results.json" \
            --markdown-out "/violin/engagements/benchmark_summary.md"
          docker run --rm --network none \
            --mount "type=bind,source=$PWD/engagements,target=/results,readonly" \
            "violin-benchmark:${GITHUB_SHA}" \
            /bin/sh -lc 'jq -e ".benchmark_pass == true" /results/benchmark_results.json'

      - name: Publish Step Summary
        if: always()
        run: |
          if [ -f engagements/benchmark_summary.md ]; then
            cat engagements/benchmark_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hermes-benchmark-results-${{ github.run_id }}
          path: |
            engagements/benchmark_results.json
            engagements/benchmark_summary.md
            engagements/benchmark-run-*/

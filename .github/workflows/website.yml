name: website

on:
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/website.yml'
  push:
    branches: [dev, master]
    paths:
      - 'docs/**'
      - '.github/workflows/website.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
